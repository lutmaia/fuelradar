# Testes a cada push e pull request (Marco 12, etapa B1).
# Roda a suíte inteira contra um PostgreSQL de serviço, o mesmo 16.15 do docker-compose.yml; o banco
# existe só durante o job, e a senha abaixo não protege nada fora dele. Falha se algum teste for
# ignorado: no CI, banco e dependências estão sempre disponíveis.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: radar
          POSTGRES_DB: radar
          POSTGRES_PASSWORD: ci-efemero
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      RADAR_TEST_DATABASE_URL: postgresql://radar:ci-efemero@127.0.0.1:5432/postgres
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Rodar os testes
        shell: bash
        run: |
          python -m unittest discover -s tests -t . 2>&1 | tee unittest.log
          if grep -q "skipped=" unittest.log; then
            echo "::error::Há testes ignorados; no CI todos devem rodar."
            exit 1
          fi
