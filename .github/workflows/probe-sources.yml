# Teste do download a partir do GitHub (Marco 12, etapa B2): a ANP e o Banco Central aceitam
# servidores do CI? Baixa para uma pasta temporária do job e apaga; nada é guardado nem commitado.
# Roda sozinho quando este arquivo ou o script mudam, e manualmente pela aba Actions.
name: Teste das fontes

on:
  push:
    paths:
      - .github/workflows/probe-sources.yml
      - scripts/probe_sources.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: ANP (página e semana mais recente)
        run: python scripts/probe_sources.py --only anp
      - name: Fontes externas (Banco Central, produtores e distribuição da ANP)
        if: ${{ !cancelled() }}
        run: python scripts/probe_sources.py --only externas
